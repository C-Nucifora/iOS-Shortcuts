name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plists:
    name: Shortcut plists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse shortcut property lists
        run: |
          python - <<'PYTHON'
          import plistlib
          from pathlib import Path

          paths = sorted(Path("shortcuts").glob("*.xml"))
          assert paths, "No shortcut property lists found"
          for path in paths:
              with path.open("rb") as source:
                  plistlib.load(source)
              print(f"Validated {path}")
          PYTHON
